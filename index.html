<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComfyUI Cast Receiver</title>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  /*
    The reason this receiver exists at all. Google's Default Media Receiver draws a metadata
    banner over the video whenever it is paused, and nothing on the sender side can turn that
    off. Here the player is ours, so it draws nothing it is not told to.
  */
  cast-media-player {
    --background-color: #000;
    --splash-size: 0;
    --theme-hue: 0;
    width: 100%;
    height: 100%;
  }

  /*
    A build marker, not a status readout -- the difference matters, since the diagnostic caption
    that used to live in this corner was removed for good reason. This says one thing only: which
    build of this page the device is actually running. A Cast device will happily hold a receiver
    page across sessions, so "I pushed a fix and nothing changed" has two explanations, and
    without this there is no way to tell them apart from the sofa.

    Sized in vmin rather than px: a receiver viewport is 1280x720 on some devices and 1920x1080
    on others, and this should be the same size on the screen either way.
  */
  #build {
    position: absolute;
    /* Kept off the very edge -- televisions overscan, and a corner badge is exactly what gets
       cropped. This is inside the action-safe area on a 4:3-era overscanning set. */
    left: 3vmin;
    bottom: 3vmin;
    display: flex;
    align-items: center;
    gap: 1vmin;
    padding: 0.8vmin 1.4vmin;
    border-radius: 1vmin;
    background: rgba(0, 0, 0, 0.45);
    font: 500 1.9vmin/1 system-ui, -apple-system, sans-serif;
    /* The mark's own colour, sampled from the app's icon, so the two read as one object. */
    color: #f5fd75;
    opacity: 0.7;
    pointer-events: none;
    /* The badge is a later sibling of cast-media-player and positioned, so it would paint on
       top regardless; stated explicitly because the player element's internals are not ours and
       a future SDK is free to introduce a stacking context. */
    z-index: 1;
  }

  /*
    A temporary diagnostic readout. The permanent status caption was removed for good reason,
    and this is not it coming back: it is on only while DEBUG_HUD is true, and exists because
    the device has never opened port 9222, so the television is the only instrument available
    for finding out what the d-pad actually does. Turn it off once that is answered.
  */
  #hud {
    position: absolute;
    right: 3vmin;
    top: 3vmin;
    padding: 1vmin 1.4vmin;
    border-radius: 1vmin;
    background: rgba(0, 0, 0, 0.6);
    font: 500 1.7vmin/1.5 ui-monospace, monospace;
    color: #f5fd75;
    white-space: pre;
    text-align: left;
    pointer-events: none;
    z-index: 2;
  }

  #build img {
    width: 2.6vmin;
    height: 2.6vmin;
    display: block;
  }

  /* Set by the zoom message handler below; the video itself is what gets transformed. */
  video {
    transform-origin: 50% 50%;
    will-change: transform;
  }
</style>
</head>
<body>

  <div id="build">

<script>
(function () {
  /*
    BUMP THIS WHEN CHANGING THIS FILE. It is the entire point of the badge in the corner, and a
    version that silently stops moving is worse than no version at all -- it reads as proof the
    device is up to date while proving nothing.

    A date rather than a serial, because the question being asked is always "is this recent?",
    and a date answers that without having to remember what the current number is meant to be.
    The suffix distinguishes rebuilds within a day.

    This is deliberately hand-maintained. Stamping it at deploy time would be more reliable, but
    GitHub Pages publishes this branch directly with no build step, and swapping that for an
    Actions-based deploy to gain an automatic version is a change to how the live receiver ships
    -- worth doing on purpose, not as a side effect of adding a badge.
  */
  var RECEIVER_VERSION = '2026-09-11.8-debug';

  /*
    Diagnostic readout on the television. Set false once the d-pad's real behaviour is known --
    this exists because the device has never opened port 9222, so there is no console to read.
  */
  var DEBUG_HUD = true;

  var NAMESPACE = 'urn:x-cast:com.obyrne.comfyui';
  var context = cast.framework.CastReceiverContext.getInstance();
  var playerManager = context.getPlayerManager();

  /*
    Console only. This used to also write to an on-screen div, which was useful exactly once —
    while proving a Chromecast would load plain http:// media from an https:// receiver — and
    was a permanent caption over the video ever after. With a cast in progress the TV opens
    port 9222, so http://<tv-ip>:9222 in desktop Chrome gives the same messages with a console,
    elements and network tabs around them. That is the better tool, and it costs the picture
    nothing.
  */
  function status(text) {
    console.log('[comfyui-receiver]', text);
  }

  // What the d-pad is actually doing, since nothing else can see it.
  var hudKey = 'key: (none yet)';
  var hudSeeks = 0;
  var hudNote = '';

  function renderHud() {
    if (!DEBUG_HUD) return;
    var el = document.getElementById('hud');
    if (!el) return;
    var v = videoElement();
    var h = hold;
    el.textContent =
      hudKey + '\n' +
      'hold: ' + (h ? (h.forward ? 'FWD' : 'BACK') + ' ' + (h.endedByKeyUp ? 'timer' : 'repeat') : 'none') + '\n' +
      'seeks: ' + hudSeeks + '  rate: ' + (v ? v.playbackRate : '?') +
      '  paused: ' + (v ? v.paused : '?') + '\n' +
      't: ' + (v ? v.currentTime.toFixed(3) : '?') + '  ' + hudNote;
  }

  if (DEBUG_HUD) window.setInterval(renderHud, 200);

  /*
    Suppressing the platform's playback overlay — the title-and-scrubber bar a television draws
    when playback starts or pauses. It is not the metadata banner this receiver exists to
    escape: that one belongs to the *default* receiver and was never drawn here. This one
    belongs to the device, and survives into a custom receiver.

    Finding it took reading the shipped cast_receiver_framework.js, because there is no option
    for it. The SDK classifies the device (`ie()`): 5 audio-only, 6 automotive, 4 android with
    touch, 3, 2 non-touch with a d-pad, 1 plain non-touch. Each type gets a different UI:

      ie()===1  ->  document.createElement("tv-overlay"), swapped into the shadow DOM in place
                    of <tv-overlay-placeholder>
      ie()===2  ->  a.A(true).getTouchControlsElement(), built by /media_player.js — which is
                    served by the *device's own* web server (hence the `port-for-web-server`
                    platform value), not by gstatic, and so cannot be read from a dev machine

    A Google TV is not touch but has a d-pad, which makes it type 2, not type 1. An earlier
    attempt here hid `tv-overlay` alone and did nothing on real hardware for exactly that
    reason. There is a `dpad-controls-overlay-disabled` platform value that skips the controls
    path entirely, but it is read *from* the device and a receiver page cannot set it.

    Since the type-2 element cannot be named from here, nothing is named. The video's own
    ancestor chain is kept and everything else the SDK puts in the player is hidden, which does
    not depend on knowing what any of it is called. A MutationObserver repeats it, because the
    controls are created lazily, well after this runs.

    Two things to know if this needs revisiting:
    - The TV's own remote loses its playback UI along with the overlay. That is the premise
      here — the phone is the remote — but it is a real consequence.
    - If the overlay survives *this*, it is not in the page at all: it is Google TV system UI
      drawn above the web view, and no receiver-side change can reach it. The version badge in
      the corner is how to tell a stale page apart from a fix that did not work.
  */
  var KEEP_TAGS = { SCRIPT: 1, STYLE: 1, LINK: 1, TEMPLATE: 1, 'CAST-MEDIA-PLAYER': 1 };

  function hideChromeIn(root) {
    var video = root.querySelector('video');
    if (!video) return false;
    // The video and everything containing it has to stay; the rest is chrome.
    var keep = [];
    for (var n = video; n && n !== root; n = n.parentElement) keep.push(n);
    var all = root.querySelectorAll('*');
    for (var i = 0; i < all.length; i++) {
      var el = all[i];
      if (KEEP_TAGS[el.tagName]) continue;
      if (el === video || keep.indexOf(el) !== -1) continue;
      if (el.style.display !== 'none') el.style.display = 'none';
    }
    return true;
  }

  function hideForeignBodyNodes() {
    var kids = document.body.children;
    for (var i = 0; i < kids.length; i++) {
      var el = kids[i];
      if (el.id === 'build' || KEEP_TAGS[el.tagName]) continue;
      if (el.style.display !== 'none') el.style.display = 'none';
    }
  }

  var observing = false;
  function hidePlatformChrome() {
    var player = document.getElementById('player');
    var root = player && player.shadowRoot;
    if (!root) return;

    if (!observing) {
      // Declarative first pass: covers the type-1 element by name, and anything the SDK adds
      // to the two levels of its own template that is not part of it. CSS applies to nodes
      // added later, which the sweep below cannot do on its own.
      var style = document.createElement('style');
      style.textContent =
        'tv-overlay, tv-overlay-placeholder { display: none !important; }' +
        '#castPlayer > :not(.background):not(.foreground) { display: none !important; }';
      root.appendChild(style);

      new MutationObserver(function () {
        hideChromeIn(root);
        hideForeignBodyNodes();
      }).observe(root, { childList: true, subtree: true });
      new MutationObserver(hideForeignBodyNodes).observe(document.body, { childList: true });
      observing = true;
      status('platform chrome suppression armed');
    }

    hideChromeIn(root);
    hideForeignBodyNodes();
  }

  /*
    The <video> lives inside cast-media-player's shadow DOM. Queried lazily rather than once at
    startup because it does not exist until the first load, and re-queried on every transform in
    case the element is replaced between items.
  */
  function videoElement() {
    var player = document.getElementById('player');
    var root = player && player.shadowRoot;
    return (root && root.querySelector('video')) || document.querySelector('video');
  }

  function applyTransform(scale, offsetX, offsetY) {
    var video = videoElement();
    if (!video) {
      status('zoom ignored: no video element yet');
      return;
    }
    var s = typeof scale === 'number' && scale > 0 ? scale : 1;
    var x = typeof offsetX === 'number' ? offsetX : 0;
    var y = typeof offsetY === 'number' ? offsetY : 0;
    video.style.transform = 'translate(' + x + '%, ' + y + '%) scale(' + s + ')';
    status('zoom ' + s.toFixed(2) + 'x at ' + x + '%, ' + y + '%');
  }

  /*
    Zoom and frame-stepping arrive here as plain JSON from the phone. Both exist because
    RemoteMediaClient cannot express them: a paused Chromecast ignores seeks shorter than about
    750ms, and there is no sender-side API for scaling the picture at all. Done here they are
    just currentTime arithmetic and a CSS transform.
  */
  /*
    Frame rate is not something a <video> will tell you, so it arrives from the phone, which
    reads it off the decoder. Remembered between messages because the d-pad handler below needs
    it too and has nobody to ask -- a remote press can arrive before the phone has ever sent a
    step. 24 until told otherwise, which is what these workflows produce and what the phone
    itself falls back to.
  */
  var lastFps = 24;

  function stepFrames(frames) {
    var video = videoElement();
    if (!video) return false;
    video.pause();
    video.currentTime = Math.max(0, video.currentTime + frames / lastFps);
    status('step ' + frames + ' -> ' + video.currentTime.toFixed(3) + 's @ ' + lastFps + 'fps');
    return true;
  }

  function togglePlayPause() {
    // Through PlayerManager rather than the media element directly: this is the supported path
    // and it keeps the sender's transport in step, so the phone's own play/pause button does
    // not end up disagreeing with the television.
    var playing = playerManager.getPlayerState() === cast.framework.messages.PlayerState.PLAYING;
    if (playing) playerManager.pause(); else playerManager.play();
    status(playing ? 'paused by remote' : 'playing by remote');
    return true;
  }

  context.addCustomMessageListener(NAMESPACE, function (event) {
    var data = event.data || {};
    switch (data.type) {
      case 'zoom':
        applyTransform(data.scale, data.x, data.y);
        break;
      case 'step':
        if (data.fps > 0) lastFps = data.fps;
        stepFrames(data.forward ? 1 : -1);
        break;
      default:
        status('unknown message: ' + JSON.stringify(data).slice(0, 120));
    }
  });

  /*
    The d-pad, put back to work.

    Hiding the platform's controls overlay (see hidePlatformChrome) took the remote's playback
    UI with it, leaving the d-pad doing nothing at all. It is a perfectly good transport, and
    frame-stepping is the thing this receiver exists to make possible, so left/right step a
    frame and the centre button plays and pauses. Holding a direction repeats, which scrubs.

    Capture phase, and events are consumed once handled: the SDK still has its own key handling
    attached even though its controls are hidden, and letting these through would mean competing
    for the same press.

    Both e.key and keyCode are checked because a television remote is not a keyboard and the
    mapping is not something this can be tested against from a development machine.
  */
  /*
    Up and down move through the gallery, and they do it through the Cast queue rather than
    through anything invented here.

    The tempting alternative -- having each item carry the URLs of its neighbours -- would put a
    second copy of the gallery's ordering on the television, where it could disagree with the
    phone's. The queue is already the right shape: "Cast all" has always loaded a real
    multi-item queue, and the phone now sends the surrounding items for a single cast too, so
    there is something to move through either way. Advancing it keeps RemoteMediaClient's own
    notion of the current item correct, which is what the phone reads to keep its transport
    pointed at the right file.

    sendLocalMediaRequest is the supported way for a receiver to issue a media command to
    itself; QUEUE_NEXT and QUEUE_PREV are ordinary message types. If the queue holds one item
    these do nothing, which is the right answer -- there is nowhere to go.
  */
  function queueRequest(type) {
    try {
      var RequestData = cast.framework.messages.RequestData;
      if (typeof RequestData === 'function') return new RequestData(type);
    } catch (e) { /* fall through to the plain shape below */ }
    return { type: type, requestId: 0 };
  }

  function queueStep(forward) {
    var type = forward ? cast.framework.messages.MessageType.QUEUE_NEXT
                       : cast.framework.messages.MessageType.QUEUE_PREV;
    playerManager.sendLocalMediaRequest(queueRequest(type));
    status('queue ' + (forward ? 'next' : 'previous'));
    return true;
  }

  /*
    Tap versus hold, without trusting the remote to say which it is.

    The first attempt keyed off `event.repeat` and did nothing on the television: the hold never
    engaged, so every auto-repeat was treated as a fresh tap and a pile of single-frame seeks
    landed at once when the decoder caught up -- which is the "it jumps when I let go" this is
    fixing. A d-pad is not a keyboard and there are three plausible behaviours, so none of them
    is assumed:

      A. auto-repeat with event.repeat === true
      B. repeated keydown/keyup pairs at the repeat rate, no `repeat` flag
      C. a single keydown, no repeats at all, keyup on release

    A and B both show up as *presses arriving faster than a person taps*, which is the signal
    used: a second press of the same direction inside HOLD_GAP_MS means the button is down. C
    has no repeats to count, so a timer starts the hold if the key has not come up by
    HOLD_DELAY_MS.

    Ending it has the same problem in reverse. In B a keyup arrives between every repeat, so
    keyup cannot mean "released" -- instead each press re-arms a watchdog, and the hold ends
    when the presses stop. In C there is nothing to re-arm, so keyup is the only signal and is
    taken at face value. Which rule applies is recorded when the hold starts.
  */
  var HOLD_RATE = 0.5;
  var HOLD_GAP_MS = 250;     // presses closer together than this mean the button is held
  var HOLD_DELAY_MS = 400;   // no repeats at all: hold begins if the key has not come up
  var HOLD_IDLE_MS = 320;    // repeats stopped arriving, so it has been released
  var REVERSE_STALL_MS = 400;   // only a backstop: the loop is normally driven by 'seeked'

  var hold = null;
  var pressTimer = null;
  var idleTimer = null;
  var lastPressAt = 0;
  var lastPressDir = 0;

  function armIdleWatchdog() {
    if (idleTimer) window.clearTimeout(idleTimer);
    idleTimer = window.setTimeout(endHold, HOLD_IDLE_MS);
  }

  function startHold(forward, endedByKeyUp) {
    var video = videoElement();
    if (!video || hold) return true;
    hudSeeks = 0;
    hudNote = 'hold started';
    hold = { forward: forward, wasPlaying: !video.paused, timer: null, rateTimer: null,
             endedByKeyUp: endedByKeyUp };
    if (forward) {
      // Through PlayerManager as well as the element: the SDK owns the player's state, and a
      // bare video.play() behind its back is liable to be corrected. The rate is re-asserted
      // periodically for the same reason -- it is the one thing PlayerManager has no say over.
      playerManager.play();
      video.playbackRate = HOLD_RATE;
      hold.rateTimer = window.setInterval(function () {
        var v = videoElement();
        if (v && v.playbackRate !== HOLD_RATE) v.playbackRate = HOLD_RATE;
      }, 250);
    } else {
      /*
        Reverse cannot be playback -- a negative playbackRate is not supported -- so it is a
        seek loop. The first version fired those seeks on a fixed interval and reproduced the
        very bug this was meant to fix: seeking backwards means decoding from the preceding
        keyframe every time, the television could not keep up, and the requests queued and only
        landed once the button came up.

        So the loop is driven by completion rather than by a clock: the next seek is issued when
        the last one reports `seeked`, which means there is never more than one outstanding and
        every one of them is actually shown. How fast the device can do that is then its own
        business.

        Speed stays honest regardless, because each target is computed from elapsed wall clock
        rather than by subtracting a fixed amount per step. A slow device drops frames and still
        travels at half speed; a fast one is simply smoother.
      */
      playerManager.pause();
      hold.startedAt = new Date().getTime();
      hold.startPos = video.currentTime;

      hold.tick = function () {
        if (!hold) return;
        var v = videoElement();
        if (!v) return;
        var elapsed = (new Date().getTime() - hold.startedAt) / 1000;
        var target = Math.max(0, hold.startPos - elapsed * HOLD_RATE);
        if (target <= 0 && v.currentTime <= 0) return;   // at the start, nothing left to do
        // fastSeek is cheaper where it exists (it settles for the nearest keyframe, which is
        // all a reverse scrub needs). Chrome does not implement it, hence the fallback.
        hudSeeks++;
        hudNote = 'want ' + target.toFixed(3);
        if (typeof v.fastSeek === 'function') v.fastSeek(target); else v.currentTime = target;
      };

      hold.onSeeked = function () { hudNote = 'seeked ok'; if (hold) hold.tick(); };
      video.addEventListener('seeked', hold.onSeeked);
      // A watchdog in case a seek never reports completion, which would otherwise stall the
      // loop for as long as the button is held.
      hold.timer = window.setInterval(function () { if (hold) hold.tick(); }, REVERSE_STALL_MS);
      hold.tick();
    }
    status('hold ' + (forward ? 'forward' : 'back') + ' at ' + HOLD_RATE + 'x');
    return true;
  }

  function endHold() {
    if (idleTimer) { window.clearTimeout(idleTimer); idleTimer = null; }
    if (!hold) return;
    var video = videoElement();
    if (hold.timer) window.clearInterval(hold.timer);
    if (hold.rateTimer) window.clearInterval(hold.rateTimer);
    if (hold.onSeeked && video) video.removeEventListener('seeked', hold.onSeeked);
    if (video) {
      video.playbackRate = 1;
      if (hold.wasPlaying) playerManager.play(); else playerManager.pause();
    }
    status('hold released');
    hold = null;
  }

  function onDirectionPress(forward, isRepeat) {
    var dir = forward ? 1 : -1;
    var now = new Date().getTime();
    var rapid = isRepeat || (dir === lastPressDir && now - lastPressAt < HOLD_GAP_MS);
    lastPressAt = now;
    lastPressDir = dir;

    if (hold) {                       // already running: swallow the repeat, keep it alive
      armIdleWatchdog();
      return true;
    }
    if (pressTimer) { window.clearTimeout(pressTimer); pressTimer = null; }

    if (rapid) {
      startHold(forward, false);      // repeat-driven: the watchdog ends it
      armIdleWatchdog();
      return true;
    }

    stepFrames(dir);                  // a tap steps at once, never waiting to see what it becomes
    pressTimer = window.setTimeout(function () {
      pressTimer = null;
      startHold(forward, true);       // timer-driven: only keyup ends it
    }, HOLD_DELAY_MS);
    return true;
  }

  function handleRemoteKey(event) {
    var key = event.key;
    var code = event.keyCode || event.which;
    hudKey = 'down ' + key + '(' + code + ') rpt=' + (event.repeat ? 'Y' : 'N') +
             ' @' + (new Date().getTime() % 100000);
    renderHud();
    var left = key === 'ArrowLeft' || code === 37;
    var right = key === 'ArrowRight' || code === 39;
    var handled = false;

    if (left || right) {
      handled = onDirectionPress(right, !!event.repeat);
    } else if (key === 'ArrowDown' || code === 40) {
      // Repeats deliberately ignored: holding down would otherwise tear through the gallery an
      // item per repeat, and there is no way to stop on the one you wanted.
      handled = event.repeat ? true : queueStep(true);
    } else if (key === 'ArrowUp' || code === 38) {
      handled = event.repeat ? true : queueStep(false);
    } else if (key === 'Enter' || key === ' ' || key === 'Select' || key === 'MediaPlayPause' ||
               // 13 Enter, 32 space, 23 Android's KEYCODE_DPAD_CENTER, 179 media play/pause.
               // A television remote is not a keyboard: the centre button reaches the web view
               // as any of these depending on the device, and it was bound to Enter alone
               // before, which is the likeliest reason it did nothing.
               code === 13 || code === 32 || code === 23 || code === 179) {
      handled = event.repeat ? true : togglePlayPause();
    } else {
      return;
    }

    if (handled) {
      event.preventDefault();
      event.stopPropagation();
    }
  }

  function handleRemoteKeyUp(event) {
    var code = event.keyCode || event.which;
    hudKey = 'UP   ' + event.key + '(' + code + ')' +
             ' @' + (new Date().getTime() % 100000);
    renderHud();
    if (!(event.key === 'ArrowLeft' || event.key === 'ArrowRight' || code === 37 || code === 39)) return;
    if (pressTimer) { window.clearTimeout(pressTimer); pressTimer = null; }
    // Only believed for a hold that began on the timer. When the remote sends a keyup between
    // every repeat, this fires constantly while the button is still down.
    if (hold && hold.endedByKeyUp) endHold();
  }

  window.addEventListener('keydown', handleRemoteKey, true);
  window.addEventListener('keyup', handleRemoteKeyUp, true);

  // Kept for the log line: a Chromecast loading plain http:// media from an https:// receiver
  // page is the assumption this whole setup rests on, it is now confirmed on real hardware, and
  // this is where you would see it stop being true.
  playerManager.setMessageInterceptor(
    cast.framework.messages.MessageType.LOAD,
    function (request) {
      var url = request && request.media && request.media.contentId;
      // Also here, not only at startup: the shadow root exists by now even if it somehow did
      // not when this script first ran.
      hidePlatformChrome();
      status('LOAD ' + url);
      return request;
    }
  );

  playerManager.addEventListener(cast.framework.events.EventType.MEDIA_STATUS, function (e) {
    hidePlatformChrome();
    if (e.mediaStatus && e.mediaStatus.playerState) {
      status('state ' + e.mediaStatus.playerState);
    }
  });

  playerManager.addEventListener(cast.framework.events.EventType.ERROR, function (e) {
    status('ERROR ' + (e.detailedErrorCode || '') + ' ' + (e.error ? JSON.stringify(e.error).slice(0, 160) : ''));
  });

  var options = new cast.framework.CastReceiverOptions();
  options.customNamespaces = {};
  options.customNamespaces[NAMESPACE] = cast.framework.system.MessageType.JSON;
  // Without this the receiver shuts down as soon as the sender disconnects briefly.
  options.disableIdleTimeout = false;

  var versionEl = document.getElementById('build-version');
  if (versionEl) versionEl.textContent = RECEIVER_VERSION;

  context.start(options);
  hidePlatformChrome();
  status('receiver started, build ' + RECEIVER_VERSION);
})();
</script>
</body>
</html>
