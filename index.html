<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComfyUI Cast Receiver</title>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  /*
    The reason this receiver exists at all. Google's Default Media Receiver draws a metadata
    banner over the video whenever it is paused, and nothing on the sender side can turn that
    off. Here the player is ours, so it draws nothing it is not told to.
  */
  cast-media-player {
    --background-color: #000;
    --splash-size: 0;
    --theme-hue: 0;
    width: 100%;
    height: 100%;
  }

  /*
    A build marker, not a status readout -- the difference matters, since the diagnostic caption
    that used to live in this corner was removed for good reason. This says one thing only: which
    build of this page the device is actually running. A Cast device will happily hold a receiver
    page across sessions, so "I pushed a fix and nothing changed" has two explanations, and
    without this there is no way to tell them apart from the sofa.

    Sized in vmin rather than px: a receiver viewport is 1280x720 on some devices and 1920x1080
    on others, and this should be the same size on the screen either way.
  */
  #build {
    position: absolute;
    /* Kept off the very edge -- televisions overscan, and a corner badge is exactly what gets
       cropped. This is inside the action-safe area on a 4:3-era overscanning set. */
    left: 3vmin;
    bottom: 3vmin;
    display: flex;
    align-items: center;
    gap: 1vmin;
    padding: 0.8vmin 1.4vmin;
    border-radius: 1vmin;
    background: rgba(0, 0, 0, 0.45);
    font: 500 1.9vmin/1 system-ui, -apple-system, sans-serif;
    /* The mark's own colour, sampled from the app's icon, so the two read as one object. */
    color: #f5fd75;
    opacity: 0.7;
    pointer-events: none;
    /* The badge is a later sibling of cast-media-player and positioned, so it would paint on
       top regardless; stated explicitly because the player element's internals are not ours and
       a future SDK is free to introduce a stacking context. */
    z-index: 1;
  }

  #build img {
    width: 2.6vmin;
    height: 2.6vmin;
    display: block;
  }

  /* Set by the zoom message handler below; the video itself is what gets transformed. */
  video {
    transform-origin: 50% 50%;
    will-change: transform;
  }
</style>
</head>

  <cast-media-player id="player"></cast-media-player>

    <span id="build-version"></span>
  </div>

<script>
(function () {
  /*
    BUMP THIS WHEN CHANGING THIS FILE. It is the entire point of the badge in the corner, and a
    version that silently stops moving is worse than no version at all -- it reads as proof the
    device is up to date while proving nothing.

    A date rather than a serial, because the question being asked is always "is this recent?",
    and a date answers that without having to remember what the current number is meant to be.
    The suffix distinguishes rebuilds within a day.

    This is deliberately hand-maintained. Stamping it at deploy time would be more reliable, but
    GitHub Pages publishes this branch directly with no build step, and swapping that for an
    Actions-based deploy to gain an automatic version is a change to how the live receiver ships
    -- worth doing on purpose, not as a side effect of adding a badge.
  */
  var RECEIVER_VERSION = '2026-09-11.2';

  var NAMESPACE = 'urn:x-cast:com.obyrne.comfyui';
  var context = cast.framework.CastReceiverContext.getInstance();
  var playerManager = context.getPlayerManager();

  /*
    Console only. This used to also write to an on-screen div, which was useful exactly once —
    while proving a Chromecast would load plain http:// media from an https:// receiver — and
    was a permanent caption over the video ever after. With a cast in progress the TV opens
    port 9222, so http://<tv-ip>:9222 in desktop Chrome gives the same messages with a console,
    elements and network tabs around them. That is the better tool, and it costs the picture
    nothing.
  */
  function status(text) {
    console.log('[comfyui-receiver]', text);
  }

  /*
    Suppressing the platform's playback overlay — the title-and-scrubber bar a television draws
    when playback starts or pauses. It is not the metadata banner this receiver exists to
    escape: that one belongs to the *default* receiver and was never drawn here. This one
    belongs to the device, and survives into a custom receiver.

    Finding it took reading the shipped cast_receiver_framework.js, because there is no option
    for it. The SDK classifies the device (`ie()`): 5 audio-only, 6 automotive, 4 android with
    touch, 3, 2 non-touch with a d-pad, 1 plain non-touch. Each type gets a different UI:

      ie()===1  ->  document.createElement("tv-overlay"), swapped into the shadow DOM in place
                    of <tv-overlay-placeholder>
      ie()===2  ->  a.A(true).getTouchControlsElement(), built by /media_player.js — which is
                    served by the *device's own* web server (hence the `port-for-web-server`
                    platform value), not by gstatic, and so cannot be read from a dev machine

    A Google TV is not touch but has a d-pad, which makes it type 2, not type 1. An earlier
    attempt here hid `tv-overlay` alone and did nothing on real hardware for exactly that
    reason. There is a `dpad-controls-overlay-disabled` platform value that skips the controls
    path entirely, but it is read *from* the device and a receiver page cannot set it.

    Since the type-2 element cannot be named from here, nothing is named. The video's own
    ancestor chain is kept and everything else the SDK puts in the player is hidden, which does
    not depend on knowing what any of it is called. A MutationObserver repeats it, because the
    controls are created lazily, well after this runs.

    Two things to know if this needs revisiting:
    - The TV's own remote loses its playback UI along with the overlay. That is the premise
      here — the phone is the remote — but it is a real consequence.
    - If the overlay survives *this*, it is not in the page at all: it is Google TV system UI
      drawn above the web view, and no receiver-side change can reach it. The version badge in
      the corner is how to tell a stale page apart from a fix that did not work.
  */
  var KEEP_TAGS = { SCRIPT: 1, STYLE: 1, LINK: 1, TEMPLATE: 1, 'CAST-MEDIA-PLAYER': 1 };

  function hideChromeIn(root) {
    var video = root.querySelector('video');
    if (!video) return false;
    // The video and everything containing it has to stay; the rest is chrome.
    var keep = [];
    for (var n = video; n && n !== root; n = n.parentElement) keep.push(n);
    var all = root.querySelectorAll('*');
    for (var i = 0; i < all.length; i++) {
      var el = all[i];
      if (KEEP_TAGS[el.tagName]) continue;
      if (el === video || keep.indexOf(el) !== -1) continue;
      if (el.style.display !== 'none') el.style.display = 'none';
    }
    return true;
  }

  function hideForeignBodyNodes() {
    var kids = document.body.children;
    for (var i = 0; i < kids.length; i++) {
      var el = kids[i];
      if (el.id === 'build' || KEEP_TAGS[el.tagName]) continue;
      if (el.style.display !== 'none') el.style.display = 'none';
    }
  }

  var observing = false;
  function hidePlatformChrome() {
    var player = document.getElementById('player');
    var root = player && player.shadowRoot;
    if (!root) return;

    if (!observing) {
      // Declarative first pass: covers the type-1 element by name, and anything the SDK adds
      // to the two levels of its own template that is not part of it. CSS applies to nodes
      // added later, which the sweep below cannot do on its own.
      var style = document.createElement('style');
      style.textContent =
        'tv-overlay, tv-overlay-placeholder { display: none !important; }' +
        '#castPlayer > :not(.background):not(.foreground) { display: none !important; }';
      root.appendChild(style);

      new MutationObserver(function () {
        hideChromeIn(root);
        hideForeignBodyNodes();
      }).observe(root, { childList: true, subtree: true });
      new MutationObserver(hideForeignBodyNodes).observe(document.body, { childList: true });
      observing = true;
      status('platform chrome suppression armed');
    }

    hideChromeIn(root);
    hideForeignBodyNodes();
  }

  /*
    The <video> lives inside cast-media-player's shadow DOM. Queried lazily rather than once at
    startup because it does not exist until the first load, and re-queried on every transform in
    case the element is replaced between items.
  */
  function videoElement() {
    var player = document.getElementById('player');
    var root = player && player.shadowRoot;
    return (root && root.querySelector('video')) || document.querySelector('video');
  }

  function applyTransform(scale, offsetX, offsetY) {
    var video = videoElement();
    if (!video) {
      status('zoom ignored: no video element yet');
      return;
    }
    var s = typeof scale === 'number' && scale > 0 ? scale : 1;
    var x = typeof offsetX === 'number' ? offsetX : 0;
    var y = typeof offsetY === 'number' ? offsetY : 0;
    video.style.transform = 'translate(' + x + '%, ' + y + '%) scale(' + s + ')';
    status('zoom ' + s.toFixed(2) + 'x at ' + x + '%, ' + y + '%');
  }

  /*
    Zoom and frame-stepping arrive here as plain JSON from the phone. Both exist because
    RemoteMediaClient cannot express them: a paused Chromecast ignores seeks shorter than about
    750ms, and there is no sender-side API for scaling the picture at all. Done here they are
    just currentTime arithmetic and a CSS transform.
  */
  context.addCustomMessageListener(NAMESPACE, function (event) {
    var data = event.data || {};
    switch (data.type) {
      case 'zoom':
        applyTransform(data.scale, data.x, data.y);
        break;
      case 'step': {
        var video = videoElement();
        if (!video) return;
        var fps = data.fps > 0 ? data.fps : 24;
        video.pause();
        video.currentTime = Math.max(0, video.currentTime + (data.forward ? 1 : -1) / fps);
        status('step to ' + video.currentTime.toFixed(3) + 's');
        break;
      }
      default:
        status('unknown message: ' + JSON.stringify(data).slice(0, 120));
    }
  });

  // Kept for the log line: a Chromecast loading plain http:// media from an https:// receiver
  // page is the assumption this whole setup rests on, it is now confirmed on real hardware, and
  // this is where you would see it stop being true.
  playerManager.setMessageInterceptor(
    cast.framework.messages.MessageType.LOAD,
    function (request) {
      var url = request && request.media && request.media.contentId;
      // Also here, not only at startup: the shadow root exists by now even if it somehow did
      // not when this script first ran.
      hidePlatformChrome();
      status('LOAD ' + url);
      return request;
    }
  );

  playerManager.addEventListener(cast.framework.events.EventType.MEDIA_STATUS, function (e) {
    hidePlatformChrome();
    if (e.mediaStatus && e.mediaStatus.playerState) {
      status('state ' + e.mediaStatus.playerState);
    }
  });

  playerManager.addEventListener(cast.framework.events.EventType.ERROR, function (e) {
    status('ERROR ' + (e.detailedErrorCode || '') + ' ' + (e.error ? JSON.stringify(e.error).slice(0, 160) : ''));
  });

  var options = new cast.framework.CastReceiverOptions();
  options.customNamespaces = {};
  options.customNamespaces[NAMESPACE] = cast.framework.system.MessageType.JSON;
  // Without this the receiver shuts down as soon as the sender disconnects briefly.
  options.disableIdleTimeout = false;

  var versionEl = document.getElementById('build-version');
  if (versionEl) versionEl.textContent = RECEIVER_VERSION;

  context.start(options);
  hidePlatformChrome();
  status('receiver started, build ' + RECEIVER_VERSION);
})();
</script>
</body>
</html>
